<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>书架</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="书架">
<style>
  :root { --bg: #fff; --fg: #1f2328; --sub: #6b7280; --bd: #e5e7eb; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --fg: #d7dae0; --sub: #8b93a1; --bd: #262b33; --accent: #6ea8ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 8px 0 4px; font-size: 1.8em; }
  .sub { margin: 0 0 20px; color: var(--sub); font-size: .9em; }
  .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .book { position: relative; border: 1px solid var(--bd); border-radius: 10px; }
  .book:hover { border-color: var(--accent); }
  .book .open { display: flex; flex-direction: column; height: 100%; padding: 14px 16px; color: var(--fg); text-decoration: none; }
  .book b { font-size: 1.05em; padding-right: 28px; }
  .book span { margin-top: 4px; color: var(--sub); font-size: .85em; }
  .book em { margin-top: 8px; color: var(--sub); font-size: .75em; font-style: normal; overflow-wrap: anywhere; }
  .book .ext { position: absolute; top: 10px; right: 10px; padding: 2px 8px; border-radius: 6px; color: var(--sub); text-decoration: none; font-size: .95em; }
  .book .ext:hover { background: var(--bd); color: var(--accent); }
  .go { display: flex; gap: 8px; margin: 0 0 8px; }
  .go input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--bd); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
  .go input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .go button { padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  .tip { margin: 0 0 20px; color: var(--sub); font-size: .8em; }
  h2 { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 0 10px; font-size: 1.1em; }
  h2 button { border: 0; background: none; color: var(--sub); font: inherit; font-size: .8em; cursor: pointer; }
  h2 button:hover { color: var(--accent); }
  .book .tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; }
  .book .tools button { padding: 2px 8px; border: 0; border-radius: 6px; background: none; color: var(--sub); font: inherit; cursor: pointer; }
  .book .tools button:hover { background: var(--bd); color: var(--accent); }
  .book.rc b { padding-right: 70px; }
</style>
</head>
<body>
<main>
  <h1>📚 书架</h1>
  <p class="sub">点击书名在应用内阅读；右上角 ↗ 在浏览器新标签页打开。 <a href="notes.html">📝 笔记</a> <a href="#" data-install hidden>📲 将书架添加到桌面</a></p>
  <form class="go" id="go">
    <input id="addr" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="粘贴在线书籍地址，回车打开" aria-label="书籍网址">
    <button type="submit">打开</button>
  </form>
  <p class="tip">任意网页都可以作为书打开。有些网站禁止被嵌入，打开后若一直空白，点右下角 ⋯ →“在浏览器打开”。</p>
  <section id="recent" hidden>
    <h2>最近阅读 <button type="button" id="clr">清空</button></h2>
    <div class="books" id="rc"></div>
  </section>
  <h2>书架</h2>
  <div class="books" id="books"></div>
</main>
<script src="recent.js"></script>
<script>
(() => {
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  // 某本书配置有误（网址不合法）只跳过那一本，不影响其他书
  const card = (b) => {
    let host;
    try { host = new URL(b.url).host; } catch { console.warn('书架配置有误，已跳过：', b); return ''; }
    return `<div class="book"><a class="open" href="reader.html?id=${encodeURIComponent(b.id)}"><b>${esc(b.title)}</b><span>${esc(b.desc || '')}</span><em>${esc(host)}</em></a><a class="ext" href="${esc(b.url)}" target="_blank" rel="noopener" title="在浏览器新标签页打开">↗</a></div>`;
  };
  let shelf = [];
  fetch('books.json').then((r) => r.json()).then((books) => {
    shelf = books;
    document.getElementById('books').innerHTML = books.map(card).join('');
  }).catch(() => { document.getElementById('books').textContent = '书单加载失败'; });

  // ---- 打开自定义地址 + 最近阅读 ----
  const R = window.WRR;
  const $ = (id) => document.getElementById(id);
  const readerHref = (e) => e.id ? `reader.html?id=${encodeURIComponent(e.id)}` : `reader.html?url=${encodeURIComponent(e.url)}`;
  const ago = (t) => {
    const s = (Date.now() - t) / 1000;
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前';
    return new Date(t).toLocaleDateString('zh-CN');
  };
  const renderRecent = () => {
    const l = R.load();
    $('recent').hidden = !l.length;
    $('rc').innerHTML = l.map((e) => {
      let host = '';
      try { host = new URL(e.url).host; } catch {}
      return `<div class="book rc" data-k="${esc(e.key)}"><a class="open" href="${esc(readerHref(e))}"><b>${esc(e.title)}</b><span>${esc(ago(e.ts))}</span><em>${esc(host)}</em></a><div class="tools"><button type="button" data-a="ren" title="改名">✎</button><button type="button" data-a="del" title="从最近阅读移除">×</button></div></div>`;
    }).join('');
  };
  $('rc').addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-a]');
    if (!b) return;
    const key = b.closest('.book').dataset.k;
    const e = R.load().find((x) => x.key === key);
    if (b.dataset.a === 'del') R.remove(key);
    else if (b.dataset.a === 'ren' && e) {
      const t = prompt('书名', e.title);
      if (t && t.trim()) R.rename(key, t.trim().slice(0, 80));
    }
    renderRecent();
  });
  $('clr').addEventListener('click', () => { if (confirm('清空最近阅读记录？（不影响书架和笔记）')) { R.clear(); renderRecent(); } });

  $('go').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const url = R.parse($('addr').value);
    if (!url) { alert('这不是有效的网址。例如：https://example.com/book/'); $('addr').focus(); return; }
    // 地址就是书架上的某本书时，用书架的 id 打开（沿用它的书名和桌面图标）
    const hit = shelf.find((b) => R.keyOf(b.url).replace(/\/$/, '') === R.keyOf(url).replace(/\/$/, ''));
    location.href = hit ? `reader.html?id=${encodeURIComponent(hit.id)}` : `reader.html?url=${encodeURIComponent(url)}`;
  });
  renderRecent();
  addEventListener('pageshow', renderRecent);   // 从阅读页返回时（含 bfcache）刷新列表
})();
</script>
<script src="update.js"></script>
</body>
</html>
